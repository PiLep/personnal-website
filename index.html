  <script>
    (function () {
      // ---- Animated topographic background (light theme) ----
      var cv = document.getElementById('bg');
      if (!cv || !cv.getContext) return;
      var ctx = cv.getContext('2d');
      var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var LINES = 22;
      var INK = '26,25,22';

      // Accent is fixed in light mode — read it once, not every frame.
      var hex = (getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ff7a00');
      var AR = parseInt(hex.slice(1, 3), 16);
      var AG = parseInt(hex.slice(3, 5), 16);
      var AB = parseInt(hex.slice(5, 7), 16);
      var ACCENT = AR + ',' + AG + ',' + AB;

      var W = 0, H = 0, t = reduce ? 1.4 : 0, raf = 0;

      function resize() {
        W = cv.clientWidth; H = cv.clientHeight;
        cv.width = W * dpr; cv.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        var gx = W * (0.5 + 0.34 * Math.cos(t * 0.5));
        var gy = H * (0.45 + 0.32 * Math.sin(t * 0.7));
        var R = Math.max(W, H) * 0.6;
        var grd = ctx.createRadialGradient(gx, gy, 0, gx, gy, R);
        grd.addColorStop(0, 'rgba(' + ACCENT + ',0.14)');
        grd.addColorStop(1, 'rgba(' + ACCENT + ',0)');
        ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);

        ctx.lineWidth = 1.3;
        for (var i = 0; i < LINES; i++) {
          var baseY = (i + 0.5) / LINES * H;
          var k = Math.max(0, 1 - Math.abs(baseY - gy) / (H * 0.5));
          var kk = k * k;
          var amp = 10 + (i % 5) * 5 + kk * 26;
          ctx.beginPath();
          for (var x = -10; x <= W + 10; x += 10) {
            var y = baseY + Math.sin(x * 0.006 + t * 1.1 + i * 0.45) * amp + Math.cos(x * 0.013 - t * 0.7 + i) * 7;
            if (x < 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          var a = 0.06 + kk * 0.42;
          ctx.strokeStyle = (kk > 0.25 ? 'rgba(' + ACCENT : 'rgba(' + INK) + ',' + a + ')';
          ctx.stroke();
        }
      }

      function frame() {
        raf = requestAnimationFrame(frame);
        t += 0.006;
        draw();
      }

      resize();
      window.addEventListener('resize', function () { resize(); if (reduce) draw(); }, { passive: true });

      // Pause the loop while the tab is hidden to save CPU/battery.
      if (!reduce) {
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) {
            cancelAnimationFrame(raf); raf = 0;
          } else if (!raf) {
            frame();
          }
        });
      }

      if (reduce) { draw(); } else { frame(); }
    })();
  </script>
